<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Saad Mohammed, open to AI, GenAI, ML, Data and MLOps roles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="0.5" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7ff;letter-spacing:-1px}
      .role{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#aab4d6}
      .mono{font:500 17px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#4fd1c5}
      .dim{fill:#6b7699}
      .open{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ff0e4;letter-spacing:1.8px}
      .chip{fill:#7c8cff;fill-opacity:.12;stroke:#7c8cff;stroke-opacity:.45}
      .chiptxt{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#dfe4ff}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
      .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect y="296" width="1200" height="4" fill="url(#accent)"/>

    <g transform="translate(830 76)" fill="none" stroke-width="2">
      <path class="flow" d="M48 58H118" stroke="#7c8cff"/>
      <path class="flow" d="M186 58H268" stroke="#4fd1c5"/>
      <rect x="0" y="34" width="48" height="48" rx="10" stroke="#7c8cff" fill="#7c8cff" fill-opacity="0.08"/>
      <rect x="118" y="24" width="68" height="68" rx="14" stroke="#aab4d6" fill="#aab4d6" fill-opacity="0.06"/>
      <circle cx="292" cy="58" r="24" stroke="#4fd1c5" fill="#4fd1c5" fill-opacity="0.08"/>
      <circle class="pulse" cx="292" cy="58" r="7" fill="#4fd1c5" stroke="none"/>
      <g class="mono dim" stroke="none" style="font-size:13px" text-anchor="middle">
        <text x="24" y="112">data</text><text x="152" y="122">model</text><text x="292" y="112">decision</text>
      </g>
    </g>

    <g transform="translate(64 50)">
      <rect width="168" height="30" rx="15" fill="#4fd1c5" fill-opacity="0.14" stroke="#4fd1c5" stroke-opacity="0.6"/>
      <circle class="pulse" cx="20" cy="15" r="5" fill="#4fd1c5"/>
      <text x="34" y="20.5" class="open">OPEN TO WORK</text>
    </g>

    <text x="64" y="152" class="name">Saad Mohammed</text>
    <text x="66" y="196" class="role">AI &amp; ML Engineer · GenAI / LLM systems · Data pipelines · MLOps</text>

    <g transform="translate(64 228)" class="chiptxt" text-anchor="middle">
      <rect class="chip" width="112" height="32" rx="16"/><text x="56" y="21">AI Engineer</text>
      <rect class="chip" x="122" width="180" height="32" rx="16"/><text x="212" y="21">GenAI / LLM Engineer</text>
      <rect class="chip" x="312" width="112" height="32" rx="16"/><text x="368" y="21">ML Engineer</text>
      <rect class="chip" x="434" width="124" height="32" rx="16"/><text x="496" y="21">Data Engineer</text>
      <rect class="chip" x="568" width="136" height="32" rx="16"/><text x="636" y="21">MLOps Engineer</text>
      <rect class="chip" x="714" width="132" height="32" rx="16"/><text x="780" y="21">Data Scientist</text>
    </g>
  </g>
</svg>
