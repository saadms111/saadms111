<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="fraud-risk-platform: streaming card-fraud detection, 81% recall, 84% lower expected loss">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a1c"/><stop offset="1" stop-color="#10262a"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#4fd1c5" stop-opacity="0.26"/><stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/></radialGradient>
    <style>
      .t{font:700 28px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f2fbfa}
      .s{font:400 15.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#a6c4c2}
      .k{font:700 38px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#5fe0d3}
      .l{font:500 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7fa3a0}
      .tag{font:600 11.5px ui-monospace,Consolas,Menlo,monospace;fill:#c8eeea}
      .ey{font:600 12px ui-monospace,Consolas,Menlo,monospace;fill:#4fd1c5;letter-spacing:1.5px}
      .chip{fill:#4fd1c5;fill-opacity:.12;stroke:#4fd1c5;stroke-opacity:.4}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="358" rx="16" fill="url(#bg)" stroke="#1f4a4a"/>
  <rect x="1" y="1" width="598" height="358" rx="16" fill="url(#glow)"/>
  <text x="32" y="46" class="ey">STREAMING · MLOPS · REAL-TIME SCORING</text>
  <text x="32" y="86" class="t">fraud-risk-platform</text>
  <text x="32" y="116" class="s">Kafka → dbt → XGBoost → FastAPI, with drift-triggered</text>
  <text x="32" y="138" class="s">retraining in Airflow. Runs end to end on a laptop.</text>

  <g transform="translate(32 192)">
    <text class="k">81.2%</text><text y="24" class="l">fraud caught (rules: 55%)</text>
    <text x="180" class="k">−84%</text><text x="180" y="24" class="l">expected loss</text>
    <text x="370" class="k">33 ms</text><text x="370" y="24" class="l">p95 scoring latency</text>
  </g>

  <g transform="translate(32 262)">
    <rect class="chip" width="64" height="26" rx="13"/><text x="32" y="17.5" text-anchor="middle" class="tag">Kafka</text>
    <rect class="chip" x="72" width="52" height="26" rx="13"/><text x="98" y="17.5" text-anchor="middle" class="tag">dbt</text>
    <rect class="chip" x="132" width="80" height="26" rx="13"/><text x="172" y="17.5" text-anchor="middle" class="tag">XGBoost</text>
    <rect class="chip" x="220" width="72" height="26" rx="13"/><text x="256" y="17.5" text-anchor="middle" class="tag">MLflow</text>
    <rect class="chip" x="300" width="80" height="26" rx="13"/><text x="340" y="17.5" text-anchor="middle" class="tag">Airflow</text>
    <rect class="chip" x="388" width="80" height="26" rx="13"/><text x="428" y="17.5" text-anchor="middle" class="tag">FastAPI</text>
  </g>
  <text x="568" y="334" text-anchor="end" class="l">view repo →</text>
</svg>
