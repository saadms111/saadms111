<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="datamind-router: Text-to-SQL agent, 92% accuracy at 58% lower cost than Claude alone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1328"/><stop offset="1" stop-color="#161b3a"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#7c8cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/></radialGradient>
    <style>
      .t{font:700 28px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7ff}
      .s{font:400 15.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#aab4d6}
      .k{font:700 38px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa6ff}
      .l{font:500 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8590b8}
      .tag{font:600 11.5px ui-monospace,Consolas,Menlo,monospace;fill:#c9cff5}
      .ey{font:600 12px ui-monospace,Consolas,Menlo,monospace;fill:#7c8cff;letter-spacing:1.5px}
      .chip{fill:#7c8cff;fill-opacity:.14;stroke:#7c8cff;stroke-opacity:.4}
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="358" rx="16" fill="url(#bg)" stroke="#2a3366"/>
  <rect x="1" y="1" width="598" height="358" rx="16" fill="url(#glow)"/>
  <text x="32" y="46" class="ey">LLM · TEXT-TO-SQL · COST ROUTING</text>
  <text x="32" y="86" class="t">datamind-router</text>
  <text x="32" y="116" class="s">A LoRA-tuned local model answers first. Claude is called</text>
  <text x="32" y="138" class="s">only when the SQL looks unsafe, broken or low-confidence.</text>

  <g transform="translate(32 192)">
    <text class="k">92%</text><text y="24" class="l">execution accuracy</text>
    <text x="180" class="k">−58%</text><text x="180" y="24" class="l">cost vs Claude alone</text>
    <text x="370" class="k">66→74%</text><text x="370" y="24" class="l">local model after LoRA</text>
  </g>

  <g transform="translate(32 262)">
    <rect class="chip" width="64" height="26" rx="13"/><text x="32" y="17.5" text-anchor="middle" class="tag">vLLM</text>
    <rect class="chip" x="72" width="60" height="26" rx="13"/><text x="102" y="17.5" text-anchor="middle" class="tag">LoRA</text>
    <rect class="chip" x="140" width="80" height="26" rx="13"/><text x="180" y="17.5" text-anchor="middle" class="tag">sqlglot</text>
    <rect class="chip" x="228" width="72" height="26" rx="13"/><text x="264" y="17.5" text-anchor="middle" class="tag">Claude</text>
    <rect class="chip" x="308" width="84" height="26" rx="13"/><text x="350" y="17.5" text-anchor="middle" class="tag">FastMCP</text>
    <rect class="chip" x="400" width="72" height="26" rx="13"/><text x="436" y="17.5" text-anchor="middle" class="tag">Spider</text>
  </g>
  <text x="568" y="334" text-anchor="end" class="l">view repo →</text>
</svg>
